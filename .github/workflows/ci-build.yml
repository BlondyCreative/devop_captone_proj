name: CI Build  

on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "main" ]  

jobs:
  build:  
    runs-on: ubuntu-latest  

    container:
      image: python:3.9-slim  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Run tests
        run: nosetests -v
